name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  HUSKY: '0'
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js and the npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Fetch checksum-verified Claude API declarations
        run: npm run types:fetch
      - name: Verify the exact main revision before release operations
        run: npm run check
  release:
    name: Release Please
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # A fresh runner runs only the pinned API-based action: no checkout, npm, or PR code.
      - name: Prepare version PRs or publish approved GitHub releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
