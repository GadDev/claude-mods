name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
env:
  HUSKY: '0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Keep this name stable: it is the required status for branch protection.
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and the npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci --prefer-offline --no-audit --no-fund
      # Run independent checks even after another check fails, but stop on cancellation.
      # No continue-on-error: any failed step makes Check fail.
      - name: Lint with Oxlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Check formatting with Oxfmt
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Validate repository metadata and documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate
      - name: Fetch checksum-verified Claude API declarations
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run types:fetch
      - name: Check TypeScript
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: npm run typecheck
      - name: Run Node tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Validate and test native Claude plugins
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:native
